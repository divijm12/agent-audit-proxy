# Tool rules for the live demo (a copy of evals/policy.yaml): a short allow-list,
# everything else denied.
version: "0.1"
defaults:
  decision: deny
  on_error: deny
redact: [api_key, password, token]

rules:
  # --- clearer reasons for the obvious ones -------------------------------
  - id: no-recursive-delete
    match: {server: api, tool: bash, args_regex: {command: 'rm\s+(-\w*[rR]|--recursive)'}}
    decision: deny
    reason: Recursive deletes are prohibited.
  - id: no-secrets
    match: {server: api, args_regex: {"*": '(\.ssh/|\.aws/|\.env\b|id_rsa|credentials|/etc/shadow)'}}
    decision: deny
    reason: Agents may not touch credentials or secret files.

  # --- files: read inside the project, write only to ./workspace -----------
  - id: read-project-files
    match: {server: api, tool: read_file, args_regex: {path: '^(?!/)(?!.*\.\.)[\w./-]+$'}}
    decision: allow
  - id: write-workspace
    match: {server: api, tool: write_file, args_regex: {path: '^workspace/(?!.*\.\.)[\w./-]+$'}}
    decision: allow

  # --- shell: a few read-only commands, no shell tricks ---------------------
  # No ; | & ` $ > < or newlines, so nothing can be chained, piped, redirected or substituted.
  - id: safe-shell
    match:
      server: api
      tool: bash
      args_regex:
        command: '^(ls|pwd|cat|head|tail|wc|grep|git (status|diff|log))( [\w./=:-]+)*$'
    decision: allow

  # --- database: SELECT only ----------------------------------------------
  - id: read-only-sql
    match: {server: api, tool: sql_query, args_regex: {query: '(?i)^\s*select\b(?!.*;\s*\S)'}}
    decision: allow
