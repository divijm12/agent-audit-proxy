name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project + dev extras into .venv (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --extra dev pytest -m "not slow" -q

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project + dev extras into .venv (from uv.lock)
        run: uv sync --locked --extra dev

      - name: Set up Node (for npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run slow e2e tests
        run: uv run --extra dev pytest -m slow -q
